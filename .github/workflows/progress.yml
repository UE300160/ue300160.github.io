name: Update progress counts

on:
  schedule:
    - cron: "0 5 * * *"  # daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python .github/scripts/update_progress.py
        env:
          AOC_LEADERBOARD_URL: ${{ secrets.AOC_LEADERBOARD_URL }}
      - name: Commit changed counts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/rosalind.json
          if [ -f _data/aoc.json ]; then git add _data/aoc.json; fi
          git diff --cached --quiet || (git commit -m "Update progress counts" && git push)
